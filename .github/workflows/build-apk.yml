name: Build Android APK

# Builds the Cordova Android APK on GitHub's runners (which can reach the
# Android SDK servers). Download the APK from the run's "Artifacts" section.
#
# Optional input `app_url`: your deployed server URL (e.g.
# https://smartworker-xyz.onrender.com). The APK is a thin shell that loads
# this URL, so set it to your live backend before building a shippable APK.
# If left blank, the URL committed in config.xml and www/index.html is used.
#
# This used to run only when somebody pressed the button, and between
# August and October nobody did — a gap nothing reported, because a build
# that never starts cannot fail. It now runs on its own whenever something
# that is actually inside the APK changes.
#
# The paths filter is the point of it. The APK is a shell around a remote
# URL: templates, routes and the whole Flask app reach the phone from the
# server, not from the package, so a push that touches them produces a
# byte-identical APK. Only these files change what gets installed.

on:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'config.xml'
      - 'res/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Deployed server URL the app should load (optional)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    # Needed to publish the release at the end. The default token is
    # read-only on a push, and `gh release create` fails without this.
    permissions:
      contents: write
    # Every successful build has taken under three minutes. GitHub's default
    # is six hours, and a job that is still running serves no logs at all —
    # so if one ever does wedge, the one thing needed to diagnose it only
    # arrives once it has stopped. 25 minutes is eight times a normal run
    # and still fails while somebody is watching.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default is 'tools platform-tools', and 'tools' is a
          # package Google withdrew from the SDK repository. On the current
          # runner image sdkmanager answers "Failed to find package 'tools'"
          # and exits 1, so the whole job dies 20 seconds in, before Cordova
          # is even installed. Asking for platform-tools alone is enough —
          # everything else this build needs is installed by name in the
          # step below.
          packages: 'platform-tools'

      - name: Install Android build packages
        # cordova-android 12 targets SDK 33 and requires build-tools 33.0.2
        # specifically (its cordova.gradle checks for that exact version).
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2" "platforms;android-34" "build-tools;34.0.0" >/dev/null || true

      - name: Install Gradle 8.7
        # cordova-android 12 (AGP 8.0) builds AndroidX appcompat cleanly, but
        # its cordova.gradle uses groovy.util.XmlParser, which was removed from
        # the runner's default Gradle 9. Putting Gradle 8.7 on PATH lets the
        # `gradle wrapper` bootstrap step compile, after which the pinned AGP
        # 8.0 toolchain builds with an aapt2 that handles appcompat correctly.
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install Cordova
        run: npm install -g cordova@12

      - name: Point the app at the deployed URL (if provided)
        # On a push there are no inputs at all, so this reads as empty and
        # the step is skipped — an automatic build uses the URL committed in
        # the two files, which is the only URL it could know about.
        if: ${{ github.event.inputs.app_url != '' }}
        run: |
          URL="${{ github.event.inputs.app_url }}"
          HOST=$(echo "$URL" | sed -E 's~https?://~~; s~/.*~~')
          echo "Setting app URL to $URL (host $HOST)"
          # Rewrite whatever URL is currently baked in (the committed default is
          # the live Render app). Matching only the old replit placeholder meant
          # this silently did nothing once the default changed. Every reference
          # in both files is a full https:// URL, so one substitution covers it.
          sed -i -E "s~https://[a-z0-9.-]+\.(onrender\.com|replit\.app)~$URL~g" config.xml www/index.html
          echo "--- resulting app URL ---"
          grep -n "APP_URL\|allow-navigation\|access origin" www/index.html config.xml | head

      - name: Add Android platform
        # android@12 (AGP 8.0) has the aapt2 that compiles appcompat cleanly;
        # the Gradle 8.7 step above makes its bootstrap work on this runner.
        #
        # --verbose because this step was once thought to be hanging and was
        # not: it downloads cordova-android and then bootstraps a Gradle
        # wrapper, and with no output of its own there was nothing to read
        # while it worked. It takes about 40 seconds.
        run: cordova platform add android@12 --no-telemetry --verbose

      - name: Build debug APK
        run: cordova build android --debug --no-telemetry

      - name: Locate APK
        id: apk
        run: |
          APK=$(find platforms/android -name "*.apk" | head -1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Built: $APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartWorker-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish the APK at one permanent link
        # An artifact is the wrong way to hand somebody an app. GitHub only
        # serves one to a signed-in user, always inside a .zip, and only for
        # 90 days — so installing it on a phone means signing in to GitHub,
        # downloading a zip, finding a file manager to unpack it, and then
        # finding the apk inside. A release asset is a single tap, needs no
        # account, and never expires.
        #
        # One rolling release rather than one per build: the tag is deleted
        # and remade each time, so the link below is always the current APK
        # and the releases page never fills up with history nobody wants.
        #
        #   https://github.com/<owner>/<repo>/releases/latest/download/SmartWorker.apk
        #
        # This is a debug build, signed with Android's debug key. It is for
        # putting the app on a phone to try, not for the Play Store — that
        # needs a release build signed with a key of your own.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp "${{ steps.apk.outputs.path }}" SmartWorker.apk
          # || true because the first ever run has no release to delete, and
          # a missing one must not fail the build.
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest SmartWorker.apk \
            --title "SmartWorker APK — latest" \
            --notes "Debug build of $(git rev-parse --short HEAD), $(date -u +'%d %b %Y %H:%M UTC').

          Tap **SmartWorker.apk** below to install. Android will ask for
          permission to install from an unknown source — that is expected
          for an app that does not come from the Play Store.

          The app loads its data from the deployed server, so this file
          only needs replacing when the shell itself changes (the app URL,
          the icon, a Cordova plugin). Everything else reaches the phone
          from the server as soon as it is deployed."
          echo "Published: $(gh release view apk-latest --json url --jq .url)"
